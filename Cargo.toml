[workspace]
resolver = "2"
members = [
    "crates/piilex-cli",
    "crates/piilex-core",
    "crates/piilex-license",
    "crates/piilex-lsp",
]
exclude = ["saas/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

# ---------------------------------------------------------------------------
# Release profile: optimized for size + performance
# ---------------------------------------------------------------------------
[profile.release]
lto = "fat"            # Full cross-crate LTO for maximum optimization
codegen-units = 1      # Single codegen unit for best LTO results
strip = true           # Strip debug symbols and unneeded sections
panic = "abort"        # Smaller binary, no unwinding tables
opt-level = "z"        # Optimize primarily for size

# Separate profile for benchmarking (speed over size)
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Tree-sitter
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
streaming-iterator = "0.1"

# Regex
regex = "1.10"

# File system
walkdir = "2.5"
globset = "0.4"

# Output
tabled = "0.17"

# Error handling
anyhow = "1.0"
thiserror = "2"

# Terminal
console = "0.15"
indicatif = "0.17"

# Parallel processing
rayon = "1.10"

# LSP
lsp-server = "0.7"
lsp-types = "0.97"

# License
jsonwebtoken = "9.3"

# Testing
insta = { version = "1.39", features = ["yaml"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
