<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>piilex - Subscription Activated</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 12px; padding: 48px; max-width: 500px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; margin-bottom: 8px; color: #1a1a2e; }
    p { font-size: 16px; color: #666; line-height: 1.6; margin-bottom: 24px; }
    .license-box { background: #f5f5f5; border-radius: 8px; padding: 16px; margin-bottom: 24px; text-align: left; }
    .license-box h3 { font-size: 14px; margin-bottom: 8px; color: #333; }
    .license-box code { display: block; font-size: 12px; word-break: break-all; background: #e8e8e8; padding: 8px; border-radius: 4px; max-height: 80px; overflow: auto; }
    .license-box .copy-btn { margin-top: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: #4361ee; color: white; border: none; border-radius: 4px; }
    .steps { text-align: left; margin-bottom: 24px; }
    .steps li { padding: 6px 0; font-size: 14px; }
    .steps code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
    .btn { display: inline-block; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
    .btn-primary { background: #4361ee; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#127881;</div>
    <h1>Pro Activated!</h1>
    <p>Your piilex Pro subscription is now active. All Pro features are unlocked.</p>

    <div class="license-box" id="license-section" style="display:none;">
      <h3>Your License Key (for CLI)</h3>
      <code id="license-key">Loading...</code>
      <button class="copy-btn" onclick="copyLicense()">Copy to clipboard</button>
    </div>

    <div class="steps">
      <h3 style="margin-bottom:8px;">Activate in CLI:</h3>
      <ol>
        <li>Copy the license key above</li>
        <li>Run: <code>piilex license activate &lt;KEY&gt;</code></li>
        <li>Or set env: <code>PIILEX_LICENSE_KEY=&lt;KEY&gt;</code></li>
      </ol>
    </div>

    <a href="index.html" class="btn btn-primary">Go to Dashboard</a>
  </div>

  <script>
    const API = window.location.origin;
    const token = localStorage.getItem('piilex_token');

    if (token) {
      fetch(API + '/api/billing/license', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.token) {
          document.getElementById('license-section').style.display = 'block';
          document.getElementById('license-key').textContent = data.token;
        }
      })
      .catch(() => {});
    }

    function copyLicense() {
      const key = document.getElementById('license-key').textContent;
      navigator.clipboard.writeText(key).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy to clipboard', 2000);
      });
    }
  </script>
</body>
</html>
