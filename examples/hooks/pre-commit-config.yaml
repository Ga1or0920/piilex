# .pre-commit-config.yaml - for the pre-commit framework (https://pre-commit.com)
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      - id: piilex
        name: piilex PII scan
        entry: piilex scan --staged --fail-on high --quiet
        language: system
        types_or: [typescript, javascript, python, go, java, c#]
        pass_filenames: false
