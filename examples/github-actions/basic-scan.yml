# Example: Basic PII scan on every push
# Copy this file to .github/workflows/pii-scan.yml in your project

name: PII Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pii-scan:
    name: Scan for PII
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@v4

      - name: Run PII scan
        uses: piilex/scan@v1
        with:
          path: src/
          framework: gdpr
          fail-on: high
          output: sarif
