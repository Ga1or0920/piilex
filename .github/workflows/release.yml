name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------
  # Build release binaries for all platforms
  # ----------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: piilex
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: piilex
            ext: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: piilex
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: piilex
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: piilex.exe
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native, all languages)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross, all languages)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build slim variant (web languages only)
        if: ${{ !matrix.cross }}
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --no-default-features --features lang-web
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
               "target/${{ matrix.target }}/release/piilex-slim${{ matrix.artifact == 'piilex.exe' && '.exe' || '' }}"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
               "target/${{ matrix.target }}/release/piilex-slim"
          fi
          # Rebuild full version for packaging
          cargo build --release --target ${{ matrix.target }}

      - name: Verify binary runs
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          echo "Binary size: $(du -h "$BIN" | cut -f1)"
          "$BIN" --version

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../piilex-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../piilex-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: piilex-${{ matrix.target }}
          path: piilex-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }}

  # ----------------------------------------------------
  # Create GitHub Release with all binaries + checksums
  # ----------------------------------------------------
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum piilex-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: piilex ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            **macOS / Linux:**
            ```bash
            curl -sSfL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **Homebrew:**
            ```bash
            brew install piilex/tap/piilex
            ```

            **Windows:**
            Download `piilex-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip` below and add to PATH.

            **GitHub Action:**
            ```yaml
            - uses: piilex/scan@${{ github.ref_name }}
              with:
                path: src/
                framework: gdpr
                fail-on: high
            ```

            ## Checksums
            See `checksums-sha256.txt` for verification.
          files: |
            artifacts/piilex-*
            artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # Update Homebrew tap (multi-arch formula)
  # ----------------------------------------------------
  homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew formula
        run: bash scripts/update-homebrew.sh "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TAP_REPO: piilex/homebrew-piilex
        continue-on-error: true

  # ----------------------------------------------------
  # Publish to npm
  # ----------------------------------------------------
  npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm package version
        run: |
          cd npm
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish ./npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
