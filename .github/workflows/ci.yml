name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ----------------------------------------------------
  # Lint: formatting + clippy
  # ----------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  # ----------------------------------------------------
  # Test: unit + integration on Linux/macOS/Windows
  # ----------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Run tests (debug)
        run: cargo test --all

      - name: Run tests (release)
        run: cargo test --release --all

  # ----------------------------------------------------
  # Build: verify release binary on each platform
  # ----------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="target/${{ matrix.target }}/release/piilex.exe"
          else
            BIN="target/${{ matrix.target }}/release/piilex"
          fi
          echo "Binary size: $(du -h "$BIN" | cut -f1)"
          "$BIN" --version
          "$BIN" scan tests/fixtures/typescript/simple_pii.ts -q 2>&1

      - name: Check binary size under 10MB
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="target/${{ matrix.target }}/release/piilex.exe"
          else
            BIN="target/${{ matrix.target }}/release/piilex"
          fi
          SIZE_KB=$(du -k "$BIN" | cut -f1)
          echo "Size: ${SIZE_KB}KB"
          if [ "$SIZE_KB" -gt 10240 ]; then
            echo "ERROR: Binary exceeds 10MB limit (${SIZE_KB}KB)"
            exit 1
          fi
          echo "OK: Binary is within 10MB limit"

  # ----------------------------------------------------
  # Action: test the GitHub Action itself
  # ----------------------------------------------------
  action-test:
    name: Action E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build piilex
        run: cargo build --release

      - name: Run action on test fixtures
        uses: ./
        with:
          path: tests/fixtures/typescript
          framework: gdpr
          severity: low
          output: sarif

      - name: Verify SARIF output exists
        run: |
          if [ ! -f piilex-results.sarif ]; then
            echo "ERROR: SARIF output not generated"
            exit 1
          fi
          echo "SARIF output generated successfully"
          head -20 piilex-results.sarif
