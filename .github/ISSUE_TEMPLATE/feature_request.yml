name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to piilex!

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - PII detection (new types, patterns)
        - Language support (new language, better parsing)
        - Data flow analysis
        - Regulatory mapping (GDPR, CCPA, APPI, other)
        - CLI / output format
        - CI/CD integration
        - VS Code extension
        - Web dashboard
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this feature solve? What's your use case?
      placeholder: "As a developer working on a healthcare app, I need..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you envision this working?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any workarounds or alternatives?

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
